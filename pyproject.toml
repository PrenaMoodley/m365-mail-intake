[project]
name = "m365-mail-intake"
version = "0.1.0"
description = "File supplier invoices from a shared Microsoft 365 mailbox into SharePoint with Microsoft Graph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mail-intake = "mail_intake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_intake"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
